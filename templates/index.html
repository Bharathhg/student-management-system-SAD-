<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form action="/register" method="POST">
            <label for="name">Student Name</label>
            <input type="text" id="name-bharath" name="name" required placeholder="Enter student name">

            <label for="usn">USN</label>
            <input type="text" id="usn" name="usn" required placeholder="Enter USN (e.g., 1VU23CS001)">

            <label for="dept">Department</label>
            <input type="text" id="dept" name="dept" required placeholder="e.g. CSE (DS)">

            <input type="submit" value="Register Student">
        </form>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
