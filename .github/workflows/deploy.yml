name: CI/CD Pipeline - Student Management System

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # CI STEP: Run Automated Verification Tests
  # ==========================================
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Database Creation
        run: |
          python create_database.py

  # ==========================================
  # CD STEP 1: Build & Push Docker Image
  # ==========================================
  build-and-push:
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/student-app:latest

  # ==========================================
  # CD STEP 2: Deploy to AWS EC2 via SSH
  # ==========================================
  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "1. Ensuring persistent host data directory exists..."
            mkdir -p /home/ubuntu/student_data

            echo "2. Stopping and removing previous container..."
            docker stop student-app || true
            docker rm student-app || true

            echo "3. Pulling latest image from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/student-app:latest

            echo "4. Starting updated container with persistent database volume on port 5000..."
            docker run -d \
              --name student-app \
              -p 5000:5000 \
              -v /home/ubuntu/student_data:/app/data \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/student-app:latest

            echo "5. Continuous Deployment completed successfully! Data is persisted."
